plugins {
    id 'com.android.application'
}

// The native libraries come from the recompile (../build.sh); nothing game-derived is kept in git.
def nativeOut = "${rootDir}/../build/android-apk"

android {
    namespace 'com.yuriaaaaa.marvelnemesis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yuriaaaaa.marvelnemesis'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('MARVELNEMESIS_KEYSTORE') ?: "${rootDir}/../build/marvelnemesis.jks")
            storePassword System.getenv('MARVELNEMESIS_KEYSTORE_PASS') ?: 'android'
            keyAlias 'marvelnemesis'
            keyPassword System.getenv('MARVELNEMESIS_KEYSTORE_PASS') ?: 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["${nativeOut}/jniLibs"]
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] }
    }

    lint { checkReleaseBuilds false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
